<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visualiser Studio · Mini player</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="mini-player.css"></head>
<body><section class="mini-card" aria-label="Mini media player">
  <div class="mini-art"><span aria-hidden="true">♫</span><img id="miniArt" alt="Album artwork" hidden></div>
  <div class="mini-meta"><span id="miniSource">NOW PLAYING</span><strong id="miniTitle">Nothing playing right now</strong><span id="miniArtist">Play something in your media app</span><small id="miniState"></small></div>
  <div class="mini-timeline"><input id="miniSeek" type="range" min="0" max="1" step="0.1" value="0" aria-label="Seek media" disabled><div><span id="miniElapsed">0:00</span><span id="miniDuration">/ —:—</span></div></div>
  <div class="mini-transport"><button id="miniBack" aria-label="Previous track" data-hint="Previous track" disabled><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 5h2v14H5zM19 5v14L8 12z"/></svg></button><button id="miniRewind" aria-label="Rewind 10 seconds" data-hint="Rewind 10s (Q)" disabled>↺ 10</button><button id="miniPlay" aria-label="Play or pause" data-hint="Play / pause (Space)" disabled>▶</button><button id="miniForward" aria-label="Forward 10 seconds" data-hint="Forward 10s (E)" disabled>10 ↻</button><button id="miniSkip" aria-label="Next track" data-hint="Next track" disabled><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17 5h2v14h-2zM5 5l11 7-11 7z"/></svg></button></div>
  <details id="miniOptions"><summary aria-label="Mini-player options"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></summary><div class="mini-options-menu"><label>Opacity<output id="miniOpacityValue">100%</output><input id="miniOpacity" type="range" min="35" max="100" value="100" aria-label="Mini-player opacity"></label><button id="miniFull">Open full app</button><button id="miniQuit">Quit</button></div></details>
  <span id="miniNotice" role="status"></span>
</section>
<button class="resize-arc top-left" data-corner="tl" aria-label="Resize top left; double-click for default size"><svg viewBox="0 0 36 36"><path d="M6 29A23 23 0 0 1 29 6"/></svg></button>
<button class="resize-arc top-right" data-corner="tr" aria-label="Resize top right; double-click for default size"><svg viewBox="0 0 36 36"><path d="M6 29A23 23 0 0 1 29 6"/></svg></button>
<button class="resize-arc bottom-left" data-corner="bl" aria-label="Resize bottom left; double-click for default size"><svg viewBox="0 0 36 36"><path d="M6 29A23 23 0 0 1 29 6"/></svg></button>
<button class="resize-arc bottom-right" data-corner="br" aria-label="Resize bottom right; double-click for default size"><svg viewBox="0 0 36 36"><path d="M6 29A23 23 0 0 1 29 6"/></svg></button>
<script src="media-source.js"></script><script src="mini-player.js"></script></body></html>
