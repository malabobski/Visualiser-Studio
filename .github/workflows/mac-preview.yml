name: Mac preview installers
on:
  workflow_dispatch:
    inputs:
      release:
        description: Build the public Mac release instead of a preview
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    name: Mac ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install native Mac dependencies
        run: npm ci
      - name: Run tests
        run: node --test --test-concurrency=2 tests/*.test.js
      - name: Check Mac scripting syntax
        run: |
          osacompile -l JavaScript -o "$RUNNER_TEMP/mac-media.scpt" mac-media.jxa
          osacompile -o "$RUNNER_TEMP/mac-music-art.scpt" mac-music-art.applescript
      - name: Build preview without publishing
        if: ${{ !inputs.release }}
        run: npm run dist:mac:preview
      - name: Build public Mac release without publishing
        if: ${{ inputs.release }}
        run: node build/mac-build.cjs --release
      - name: Check packaged app and native dependencies
        run: node build/verify-mac.cjs ${{ inputs.release && '--release' || '' }}
      - name: Collect testing notes
        if: ${{ !inputs.release }}
        run: cp MAC_TESTING.md dist/mac-preview/MAC_TESTING.md
      - uses: actions/upload-artifact@v4
        with:
          name: Visualiser-Studio-Mac-${{ inputs.release && 'Release' || 'Preview' }}-${{ matrix.arch }}
          path: |
            dist/mac-preview/*.dmg
            dist/mac-preview/*.zip
            dist/mac-preview/MAC_TESTING.md
            dist/mac-release/*.dmg
            dist/mac-release/*.zip
          if-no-files-found: error
          retention-days: 30
